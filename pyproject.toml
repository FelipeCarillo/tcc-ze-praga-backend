[project]
name = "tcc-ze-praga-backend"
version = "0.1.0"
description = "Zé Praga — core backend service for plant disease diagnosis app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "supabase>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "openai>=2.38.0",
    "langgraph>=1.2.1",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langchain-openai>=1.2.2",
    "psycopg[binary]>=3.3.4",
    "sse-starlette>=3.4.4",
    "tavily-python>=0.7.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in function signatures is intentional
    "UP046",  # Pydantic Generic requires old-style TypeVar, not PEP 695
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F401", "I001"]  # re-exports + long fixtures common in tests
"app/domains/inference/service.py" = ["E501"]  # long disease description strings
"alembic/versions/*.py" = ["E501"]  # autogenerated migrations

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/db/storage.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
